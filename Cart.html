
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shopping Cart | AURA JAWANI</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: #080808;
    color: white;
    font-family: Arial, sans-serif;
}

header {
    padding: 25px 7%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid #292929;
}

.logo {
    color: #d6b56d;
    font-size: 23px;
    font-weight: bold;
    letter-spacing: 3px;
}

header a {
    color: white;
    text-decoration: none;
    margin-left: 20px;
}

h1 {
    text-align: center;
    margin: 50px 0 35px;
    letter-spacing: 3px;
}

.container {
    max-width: 1000px;
    margin: auto;
    padding: 20px;
}

.cart-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 15px;
    padding: 22px;
    background: #171717;
    margin-bottom: 15px;
}

.item-info h3 {
    margin-bottom: 10px;
}

.price {
    color: #d6b56d;
}

.quantity {
    display: flex;
    align-items: center;
    gap: 12px;
}

.quantity button {
    padding: 8px 13px;
    background: #d6b56d;
    border: none;
    cursor: pointer;
}

.remove {
    background: transparent;
    color: #ff7777;
    border: none;
    cursor: pointer;
}

.summary {
    background: #171717;
    padding: 30px;
    margin-top: 30px;
}

.summary p {
    display: flex;
    justify-content: space-between;
    margin: 15px 0;
}

.total {
    color: #d6b56d;
    font-size: 22px;
    font-weight: bold;
}

.checkout {
    display: block;
    width: 100%;
    background: #d6b56d;
    color: black;
    text-decoration: none;
    text-align: center;
    padding: 17px;
    margin-top: 25px;
    font-weight: bold;
}

.continue {
    display: inline-block;
    margin-top: 25px;
    color: #d6b56d;
    text-decoration: none;
}

.empty {
    text-align: center;
    padding: 50px 15px;
    color: #aaa;
}

@media(max-width: 600px) {
    .cart-item {
        flex-wrap: wrap;
    }
}
</style>
</head>

<body>

<header>
    <div class="logo">AURA JAWANI</div>
    <nav>
        <a href="index.html">HOME</a>
        <a href="shop.html">SHOP</a>
    </nav>
</header>

<h1>YOUR SHOPPING CART</h1>

<div class="container">

    <div id="cartItems"></div>

    <div class="summary" id="summary">
        <p>
            <span>Subtotal</span>
            <span id="subtotal">€0.00</span>
        </p>

        <p>
            <span>Shipping</span>
            <span>Calculated at checkout</span>
        </p>

        <hr style="border-color:#444;margin:20px 0;">

        <p class="total">
            <span>Total</span>
            <span id="total">€0.00</span>
        </p>

        <a href="checkout.html" class="checkout">
            PROCEED TO CHECKOUT
        </a>
    </div>

    <a href="shop.html" class="continue">
        ← CONTINUE SHOPPING
    </a>

</div>

<script>
function getCart() {
    return JSON.parse(localStorage.getItem('auraCart') || '[]');
}

function saveCart(cart) {
    localStorage.setItem('auraCart', JSON.stringify(cart));
    renderCart();
}

function changeQuantity(index, amount) {
    let cart = getCart();

    cart[index].quantity += amount;

    if (cart[index].quantity <= 0) {
        cart.splice(index, 1);
    }

    saveCart(cart);
}

function removeItem(index) {
    let cart = getCart();
    cart.splice(index, 1);
    saveCart(cart);
}

function renderCart() {
    const cart = getCart();
    const container = document.getElementById('cartItems');
    const summary = document.getElementById('summary');

    container.innerHTML = '';

    if (cart.length === 0) {
        container.innerHTML = `
            <div class="empty">
                <h2>Your Cart Is Empty</h2>
                <p style="margin-top:15px">
                    Discover your next favourite style.
                </p>
                <br>
                <a href="shop.html" style="color:#d6b56d">
                    SHOP NOW
                </a>
            </div>`;

        summary.style.display = 'none';
        return;
    }

    summary.style.display = 'block';

    let total = 0;

    cart.forEach((item, index) => {
        let itemTotal = item.price * item.quantity;
        total += itemTotal;

        container.innerHTML += `
            <div class="cart-item">
                <div class="item-info">
                    <h3>${escapeHTML(item.name)}</h3>
                    <div class="price">€${Number(item.price).toFixed(2)}</div>
                </div>

                <div class="quantity">
                    <button onclick="changeQuantity(${index},-1)">−</button>
                    <span>${item.quantity}</span>
                    <button onclick="changeQuantity(${index},1)">+</button>
                </div>

                <div class="price">
                    €${itemTotal.toFixed(2)}
                </div>

                <button class="remove"
                    onclick="removeItem(${index})">
                    REMOVE
                </button>
            </div>`;
    });

    document.getElementById('subtotal').textContent =
        '€' + total.toFixed(2);

    document.getElementById('total').textContent =
        '€' + total.toFixed(2);
}

function escapeHTML(value) {
    return String(value).replace(/[&<>"']/g, char => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#39;'
    })[char]);
}

renderCart();
</script>

</body>
</html>
